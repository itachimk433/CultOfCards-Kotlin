name: Build & Release APK

on:
  push:
    branches: [ main ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Build Release APK (unsigned)
        run: gradle assembleRelease --no-daemon

      - name: Rename APKs for release
        run: |
          VERSION="${GITHUB_REF_NAME:-dev}"
          cp app/build/outputs/apk/debug/app-debug.apk \
             "CultOfCards-${VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release-unsigned.apk \
             "CultOfCards-${VERSION}-release-unsigned.apk"

      - name: Upload Debug APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CultOfCards-debug
          path: CultOfCards-*-debug.apk
          retention-days: 30

      - name: Upload Release APK (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: CultOfCards-release
          path: CultOfCards-*-release-unsigned.apk
          retention-days: 30

      # Only publish a GitHub Release when a version tag is pushed
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Cult of Cards ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-beta') || contains(github.ref_name, '-alpha') || contains(github.ref_name, '-rc') }}
          generate_release_notes: true
          files: |
            CultOfCards-${{ github.ref_name }}-debug.apk
            CultOfCards-${{ github.ref_name }}-release-unsigned.apk
          body: |
            ## Cult of Cards ${{ github.ref_name }}

            ### Installation
            Download **CultOfCards-${{ github.ref_name }}-debug.apk** and side-load it on any Android 8.0+ device.

            > **Note:** The release APK is unsigned. To install it you must use the debug build, or sign the release build with your own keystore before distribution.

            ### What's included
            | File | Description |
            |------|-------------|
            | `CultOfCards-${{ github.ref_name }}-debug.apk` | Debug build — ready to install via ADB or sideload |
            | `CultOfCards-${{ github.ref_name }}-release-unsigned.apk` | Optimised release build — sign before distributing |
